workflows:

  # ── Android: quality gate + dev/staging debug APKs ───────────────────────
  android-debug:
    name: Android — quality + dev & staging debug APKs
    max_build_duration: 60
    environment:
      flutter: 3.44.4
      java: 17
      groups:
        - firebase_config
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: development
          include: true
        - pattern: feature/*
          include: true
        - pattern: chore/*
          include: true
        - pattern: fix/*
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Dart format check
        script: dart format --set-exit-if-changed lib test

      - name: Flutter analyze
        script: flutter analyze --no-fatal-infos

      - name: Inject Firebase & Maps config
        script: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON is not set in Codemagic environment variables."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | openssl base64 -d -A > android/app/google-services.json
          printf 'MAPS_API_KEY=%s\n' "${MAPS_API_KEY:-}" > android/secrets.properties

      - name: Flutter unit tests
        script: flutter test --reporter expanded

      # The repo's gradle.properties sets -Xmx8G, which is fine locally but OOMs
      # on Codemagic's 8GB build machine (no headroom for the OS + Kotlin daemon
      # + workers). A later duplicate key wins in a properties file, so append a
      # smaller heap override here — CI-only, the committed value is untouched.
      - name: Cap Gradle heap for the CI machine
        script: |
          printf '\norg.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m\n' >> android/gradle.properties
          tail -n 3 android/gradle.properties

      - name: Build dev debug APK
        script: flutter build apk --debug --flavor dev -t lib/main_dev.dart --dart-define=GEMINI_API_KEY="${GEMINI_API_KEY:-}" --dart-define=SERPER_API_KEY="${SERPER_API_KEY:-}"

      - name: Build staging debug APK
        script: flutter build apk --debug --flavor staging -t lib/main_staging.dart --dart-define=GEMINI_API_KEY="${GEMINI_API_KEY:-}" --dart-define=SERPER_API_KEY="${SERPER_API_KEY:-}"

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      email:
        recipients:
          - hakemm663@gmail.com
        notify:
          success: true
          failure: true

  # ── iOS: quality gate + dev/staging no-codesign builds ───────────────────
  ios-debug:
    name: iOS — quality + dev & staging no-codesign builds
    max_build_duration: 60
    environment:
      flutter: 3.44.4
      xcode: latest
      cocoapods: default
      groups:
        - firebase_config
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: development
          include: true
        - pattern: feature/*
          include: true
        - pattern: chore/*
          include: true
        - pattern: fix/*
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Inject Firebase & Maps config
        script: |
          if [ -z "$GOOGLE_SERVICE_INFO_DEV" ] || [ -z "$GOOGLE_SERVICE_INFO_STAGING" ]; then
            echo "ERROR: GOOGLE_SERVICE_INFO_DEV / STAGING not set in Codemagic environment variables."
            exit 1
          fi
          mkdir -p ios/config
          echo "$GOOGLE_SERVICE_INFO_DEV"     | openssl base64 -d -A > ios/config/GoogleService-Info-dev.plist
          echo "$GOOGLE_SERVICE_INFO_STAGING" | openssl base64 -d -A > ios/config/GoogleService-Info-staging.plist
          printf 'MAPS_API_KEY=%s\n' "${MAPS_API_KEY:-}" > ios/Flutter/Secrets.xcconfig

      - name: CocoaPods install
        script: cd ios && pod install

      - name: Flutter unit tests
        script: flutter test --reporter expanded

      - name: Build dev iOS (no codesign)
        script: |
          flutter build ios \
            --debug \
            --flavor dev \
            -t lib/main_dev.dart \
            --no-codesign \
            --dart-define=GEMINI_API_KEY="${GEMINI_API_KEY:-}" \
            --dart-define=SERPER_API_KEY="${SERPER_API_KEY:-}"

      - name: Build staging iOS (no codesign)
        script: |
          flutter build ios \
            --debug \
            --flavor staging \
            -t lib/main_staging.dart \
            --no-codesign \
            --dart-define=GEMINI_API_KEY="${GEMINI_API_KEY:-}" \
            --dart-define=SERPER_API_KEY="${SERPER_API_KEY:-}"

    artifacts:
      - build/ios/outputs/**/*.app

    publishing:
      email:
        recipients:
          - hakemm663@gmail.com
        notify:
          success: true
          failure: true
