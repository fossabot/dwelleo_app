name: Android Validation

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

concurrency:
  group: android-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-debug-builds:
    name: android / dev-staging debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
          cache-key: flutter-3.44.4-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Flutter pub get
        run: flutter pub get

      # Firebase + Maps config are gitignored (they carry project keys), so a
      # clean CI checkout lacks them and the google-services Gradle plugin would
      # fail. Materialize them from base64/plain GitHub secrets. See
      # docs/ci/SECRETS.md for how to produce each value.
      - name: Materialize Firebase & Maps config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set (see docs/ci/SECRETS.md)."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | openssl base64 -d -A > android/app/google-services.json
          printf 'MAPS_API_KEY=%s\n' "$MAPS_API_KEY" > android/secrets.properties

      - name: Build dev debug APK
        run: flutter build apk --debug --flavor dev -t lib/main_dev.dart

      - name: Build staging debug APK
        run: flutter build apk --debug --flavor staging -t lib/main_staging.dart

      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
