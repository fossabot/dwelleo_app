name: Android Validation

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

concurrency:
  group: android-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-debug-builds:
    name: android / dev-staging debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
          cache-key: flutter-3.44.4-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Flutter pub get
        run: flutter pub get

      - name: Build dev debug APK
        run: flutter build apk --debug --flavor dev -t lib/main_dev.dart

      - name: Build staging debug APK
        run: flutter build apk --debug --flavor staging -t lib/main_staging.dart

      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
