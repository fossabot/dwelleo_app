name: iOS Validation

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

concurrency:
  group: ios-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-simulator-builds:
    name: ios / dev-staging simulator builds
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
          cache-key: flutter-3.44.4-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Flutter pub get
        run: flutter pub get

      - name: CocoaPods install
        working-directory: ios
        run: pod install --repo-update

      - name: Build dev iOS simulator
        run: flutter build ios --simulator --flavor dev -t lib/main_dev.dart --no-codesign

      - name: Build staging iOS simulator
        run: flutter build ios --simulator --flavor staging -t lib/main_staging.dart --no-codesign
