name: Android Distribute

# Builds the production APK and ships it to Firebase App Distribution so the
# internal-testers group is emailed a new build. Runs on every push to
# development, and on demand via the Actions tab (workflow_dispatch).
on:
  push:
    branches: [development]
  workflow_dispatch:

concurrency:
  group: android-distribute-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  distribute:
    name: android / firebase app distribution
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
          cache-key: flutter-3.44.4-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Setup Ruby + Bundler (android/Gemfile)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/android/Gemfile

      - name: Flutter pub get
        run: flutter pub get

      # Materialize gitignored config + the Firebase service-account credential
      # from GitHub secrets. See docs/ci/SECRETS.md.
      - name: Materialize Firebase config & credentials
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "::error::MAPS_API_KEY secret is not set (see docs/ci/SECRETS.md)."
            exit 1
          fi
          # A JSON secret may hold either raw JSON or base64 — accept both, then
          # validate. A malformed/empty secret fails HERE with a clear message
          # instead of deep inside fastlane (JSON::ParserError at column 1).
          write_json_secret() {
            local value="$1" dest="$2" name="$3"
            if [ "$(printf '%s' "$value" | tr -d '[:space:]' | cut -c1)" = '{' ]; then
              printf '%s' "$value" > "$dest"                          # already raw JSON
            else
              printf '%s' "$value" | openssl base64 -d -A > "$dest" 2>/dev/null || true
            fi
            if ! jq empty "$dest" >/dev/null 2>&1; then
              echo "::error::$name did not resolve to valid JSON. Set it to base64 of the file (base64 -i <file> | pbcopy) or paste the raw JSON. See docs/ci/SECRETS.md."
              exit 1
            fi
          }
          write_json_secret "$GOOGLE_SERVICES_JSON" android/app/google-services.json GOOGLE_SERVICES_JSON
          write_json_secret "$FIREBASE_SERVICE_ACCOUNT_JSON" android/fastlane/firebase-service-account.json FIREBASE_SERVICE_ACCOUNT_JSON
          printf 'MAPS_API_KEY=%s\n' "$MAPS_API_KEY" > android/secrets.properties

      - name: Fastlane → Firebase App Distribution
        working-directory: android
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/android/Gemfile
          FIREBASE_SERVICE_ACCOUNT_JSON_PATH: ${{ github.workspace }}/android/fastlane/firebase-service-account.json
        run: bundle exec fastlane firebase_distribution
